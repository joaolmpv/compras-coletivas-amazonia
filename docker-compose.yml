version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: compras_coletivas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras_dev_password
      POSTGRES_DB: compras_coletivas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: compras_coletivas_mq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
